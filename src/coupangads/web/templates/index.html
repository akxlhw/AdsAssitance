<!DOCTYPE html>
<html lang="zh-CN" data-theme="korean-minimal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoupangAds</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/themes/korean-minimal.css">
  <link rel="stylesheet" href="/static/css/themes/editorial.css">
  <link rel="stylesheet" href="/static/css/themes/warm-healing.css">
  <link rel="stylesheet" href="/static/css/themes/dark-industrial.css">
  <link rel="stylesheet" href="/static/css/themes/retro-film.css">
  <link rel="stylesheet" href="/static/css/themes/cyber-neon.css">
  <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>CoupangAds</h1>
      <div class="header-controls">
        <select id="theme-select"></select>
        <button id="config-btn" class="icon-button" title="API 配置">⚙️</button>
      </div>
    </header>

    <div id="upload-state" class="state">
      <div class="upload-zone" id="upload-zone">
        <div class="upload-icon">📁</div>
        <h2>拖拽产品图到这里</h2>
        <p class="subtitle">支持 JPG / PNG / HEIC / WEBP，建议 3-10 张</p>
        <input type="file" id="file-input" multiple accept="image/*" hidden>
      </div>
      <div class="thumbnail-grid" id="thumbnail-grid"></div>
      <button id="start-btn" class="primary-button">开始生成</button>
    </div>

    <div id="progress-state" class="state hidden">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
      <div id="progress-percent">0%</div>
      <div class="steps" id="steps"></div>
      <div class="image-grid" id="image-grid"></div>
    </div>

    <div id="result-state" class="state hidden">
      <h2>生成结果</h2>
      <div id="text-cards" class="text-cards"></div>
      <div id="image-gallery" class="image-gallery"></div>
      <a id="download-btn" class="primary-button" download>下载全部资产</a>
    </div>
  </div>

  <div id="config-modal" class="modal hidden">
    <div class="modal-content">
      <h2>API 配置</h2>
      <form id="config-form">
        <label>
          Gemini API Key
          <span id="gemini-status">未配置</span>
          <input type="password" id="gemini-key" placeholder="留空表示不修改">
        </label>
        <label>
          Doubao API Key
          <span id="doubao-status">未配置</span>
          <input type="password" id="doubao-key" placeholder="留空表示不修改">
        </label>
        <label>
          默认线路
          <select id="default-provider">
            <option value="gemini">Gemini</option>
            <option value="doubao">Doubao</option>
          </select>
        </label>
        <button type="submit">保存</button>
      </form>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
