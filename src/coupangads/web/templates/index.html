<!DOCTYPE html>
<html lang="zh-CN" data-theme="korean-minimal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoupangAds</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/themes/korean-minimal.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/home.css">
  <link rel="stylesheet" href="/static/css/prompt-studio.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="preview-modal" class="preview-modal hidden">
    <div class="preview-backdrop"></div>
    <div class="preview-content">
      <button class="preview-close" id="preview-close">&times;</button>
      <div id="preview-body"></div>
    </div>
  </div>

  <div class="container">
    <header>
      <h1>CoupangAds</h1>
      <div class="header-controls">
        <button id="config-btn" class="icon-button" title="API 配置" aria-label="API 配置">⚙️</button>
      </div>
    </header>

    <div id="upload-state" class="state">
      <label>
        产品名称
        <input type="text" id="product-name" placeholder="例如：dog-harness-001" value="">
      </label>
      <div class="upload-zone" id="upload-zone">
        <div class="upload-icon">📁</div>
        <h2>拖拽产品图到这里</h2>
        <p class="subtitle">支持 JPG / PNG / HEIC / WEBP，建议 3-10 张</p>
        <input type="file" id="file-input" multiple accept="image/*" hidden>
      </div>
      <div class="thumbnail-grid" id="thumbnail-grid"></div>

      <div class="step-options">
        <div class="step-options-header">
          <h3>生成选项</h3>
          <button type="button" id="toggle-steps" class="link-button">取消全选</button>
        </div>
        <label class="step-option"><input type="checkbox" value="product_report" checked> 商品画像</label>
        <label class="step-option"><input type="checkbox" value="title" checked> 标题</label>
        <label class="step-option"><input type="checkbox" value="keywords" checked> 关键词</label>
        <label class="step-option"><input type="checkbox" value="selling_points" checked> 卖点文案</label>
        <label class="step-option"><input type="checkbox" value="instagram" checked> INS 文案</label>
        <label class="step-option"><input type="checkbox" value="images" checked> 详情页图片</label>
      </div>

      <button id="start-btn" class="primary-button">开始生成</button>
    </div>

    <div id="progress-state" class="state hidden">
      <div class="progress-container">
        <div class="progress-percentage" id="progress-percent">0%</div>
        <div class="progress-message" id="progress-message">
          <span id="progress-message-text">准备中...</span>
          <button id="abort-link" class="abort-link" type="button">中止</button>
          <span id="abort-error" class="abort-error hidden"></span>
        </div>
        <div class="progress-bar-track progress-bar-track--minimal">
          <div class="progress-bar-fill" id="progress-bar"></div>
          <div class="progress-bar-shimmer" id="progress-bar-shimmer"></div>
        </div>
        <div class="aborted-state hidden" id="aborted-state">
          <p class="aborted-state__message">生成已中止</p>
          <a id="view-results-btn" class="primary-button" href="#">查看已生成结果</a>
        </div>
        <div class="progress-preview-bar" id="progress-preview-bar"></div>
        <div class="progress-steps" id="steps"></div>
      </div>
    </div>

    <div id="result-state" class="state hidden">
      <h2>生成结果</h2>
      <div id="text-cards" class="text-cards"></div>
      <div id="image-gallery" class="image-gallery"></div>
      <div class="result-actions">
        <button id="refresh-result" class="secondary-button">刷新结果</button>
        <a id="download-btn" class="primary-button" download>下载全部资产</a>
      </div>
    </div>
  </div>

  <div id="config-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-panel config-panel">
      <div class="config-panel__header">
        <h2>API 配置</h2>
        <p class="config-panel__subtitle">选择模型提供商并填写密钥</p>
      </div>

      <form id="config-form">
        <!-- 文本生成 -->
        <div class="config-card" data-config-group="text">
          <h3 class="config-card__title">文本生成</h3>
          <div class="segmented-control" role="group" aria-label="文本生成提供商">
            <button type="button" class="segmented-control__btn is-active" data-provider="gemini" data-target="text" aria-pressed="true">Gemini</button>
            <button type="button" class="segmented-control__btn" data-provider="deepseek" data-target="text" aria-pressed="false">DeepSeek</button>
            <button type="button" class="segmented-control__btn" data-provider="mock" data-target="text" aria-pressed="false">Mock</button>
          </div>

          <div class="config-fields" data-fields-for="text-gemini">
            <div class="config-field">
              <div class="config-field__label-row">
                <label for="gemini-key">Gemini API Key</label>
                <span id="gemini-status" class="config-status config-status--unconfigured">未配置</span>
              </div>
              <input type="password" id="gemini-key" name="gemini_api_key" placeholder="输入 API Key">
            </div>
          </div>

          <div class="config-fields hidden" data-fields-for="text-deepseek">
            <div class="config-field">
              <div class="config-field__label-row">
                <label for="deepseek-key">DeepSeek API Key</label>
                <span id="deepseek-status" class="config-status config-status--unconfigured">未配置</span>
              </div>
              <input type="password" id="deepseek-key" name="deepseek_api_key" placeholder="输入 API Key">
            </div>
            <div class="config-field">
              <label for="deepseek-model">DeepSeek Model</label>
              <input type="text" id="deepseek-model" name="deepseek_model" value="deepseek-v4-pro">
            </div>
          </div>

          <div class="config-fields hidden" data-fields-for="text-mock">
            <div class="config-mock-hint">Mock 模式：离线开发，不调用真实 API</div>
          </div>
        </div>

        <!-- 图片生成 -->
        <div class="config-card" data-config-group="image">
          <h3 class="config-card__title">图片生成</h3>
          <div class="segmented-control" role="group" aria-label="图片生成提供商">
            <button type="button" class="segmented-control__btn is-active" data-provider="gemini" data-target="image" aria-pressed="true">Gemini</button>
            <button type="button" class="segmented-control__btn" data-provider="doubao" data-target="image" aria-pressed="false">Doubao</button>
            <button type="button" class="segmented-control__btn" data-provider="mock" data-target="image" aria-pressed="false">Mock</button>
          </div>

          <div class="config-fields" data-fields-for="image-gemini">
            <div class="config-field">
              <div class="config-field__label-row">
                <label for="image-gemini-key">Gemini API Key</label>
                <span id="gemini-status-image" class="config-status config-status--unconfigured">未配置</span>
              </div>
              <input type="password" id="image-gemini-key" name="image_gemini_api_key" placeholder="输入 API Key">
            </div>
          </div>

          <div class="config-fields hidden" data-fields-for="image-doubao">
            <div class="config-field">
              <div class="config-field__label-row">
                <label for="doubao-key">Doubao API Key</label>
                <span id="doubao-status" class="config-status config-status--unconfigured">未配置</span>
              </div>
              <input type="password" id="doubao-key" name="doubao_api_key" placeholder="输入 API Key">
            </div>
          </div>

          <div class="config-fields hidden" data-fields-for="image-mock">
            <div class="config-mock-hint">Mock 模式：离线开发，不调用真实 API</div>
          </div>
        </div>

        <button type="submit" class="config-submit">保存配置</button>
      </form>
    </div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
